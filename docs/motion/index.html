<!--
  The README's demo video, as one page seeked frame by frame: render.mjs calls window.seek(t) for every frame.
  Every style is computed from t inside seek(): no CSS transitions, no timers, nothing kept between frames.
  Springs are closed-form step responses; a value that changes target several times is the sum of one spring per
  change, and every track is periodic over the loop (the previous cycle's springs are summed in too), so the
  last frame flows into the first. 124 BPM (the song's measured tempo), 16 bars, 64 beats.
  UI, labels and numbers: the app's own (src/window.html, src/pdf.ts), on the demo folder made by demo/make-demo.mjs.

<script>
"use strict";
// ══ Time ═════════════════════════════════════════════════════════════════════
const BPM = 124, B = 60 / BPM, T = 64 * B; // 30.968 s
/** Seconds at bar.beat (+ a fraction of a beat). */
const bt = (bar, beat = 1, f = 0) => ((bar - 1) * 4 + (beat - 1) + f) * B;

// ══ Springs ══════════════════════════════════════════════════════════════════
const SP = { f: 2.3, z: 0.86 };     // default: settles in ~0.45 s, ~0.5 % overshoot
const FAST = { f: 3.6, z: 0.9 };
const SNAP = { f: 5.5, z: 0.95 };
const SOFT = { f: 1.55, z: 0.95 };  // camera
const CUR = { f: 2.1, z: 0.93 };    // cursor
/** Closed-form step response of a damped spring, 0 → 1. */
function S(dt, k = SP) {
  if (dt <= 0) return 0;
  const w = 2 * Math.PI * k.f, z = k.z;
  if (z >= 0.999) return 1 - Math.exp(-w * dt) * (1 + w * dt); // critically damped
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
/**
 * A value made of one spring per target change: keys [[t, v, k?], …]. Periodic over T: the previous cycle's
 * springs are summed in too, and the first key's change is measured from the last key's value, so the loop closes.
 */
function track(keys, k0 = SP) {
  keys = keys.slice().sort((a, b) => a[0] - b[0]);
  const arr = Array.isArray(keys[0][1]);
  const V = keys.map((k) => (arr ? k[1] : [k[1]]));
  const n = V[0].length;
  const last = V[V.length - 1];
  const D = keys.map((k, i) => ({ t: k[0], k: k[2] || k0, d: V[i].map((x, j) => x - (i ? V[i - 1][j] : last[j])) })).filter((e) => e.d.some((x) => Math.abs(x) > 1e-9));
  return (t) => {
    const out = last.slice();
    for (const e of D) {
      const s = S(t - e.t, e.k) + S(t - e.t + T, e.k) - 1; // this cycle's spring + last cycle's (settled = 1) − the base
      for (let j = 0; j < n; j++) out[j] += e.d[j] * s;
    }
    return arr ? out : out[0];
  };
}
/** The value of the last key at or before t (wrapping). */
function step(keys) {
  keys = keys.slice().sort((a, b) => a[0] - b[0]);
  return (t) => {
    let v = keys[keys.length - 1][1];
    for (const k of keys) if (k[0] <= t) v = k[1];
    return v;
  };
}
/** Presence in windows [[a, b], …] (b may pass T): springs in at a, out at b. 0 … 1. */
function vis(t, wins, kin = FAST, kout = FAST) {
  let v = 0;
  for (const [a, b] of wins) {
    let w = 0;
    for (const c of [-1, 0, 1]) w += S(t - a - c * T, kin) - S(t - b - c * T, kout);
    v = Math.max(v, w);
  }
  return Math.min(1, Math.max(0, v));
}
/** A press: down fast, back up. */
const press = (t, tc) => S(t - tc + 0.05, SNAP) - S(t - tc - 0.07, FAST) + (S(t - tc + 0.05 + T, SNAP) - S(t - tc - 0.07 + T, FAST));

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, v) => a + (b - a) * v;
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, v) => a.map((x, i) => mix(x, b[i], v));
const hash = (a, b) => { let x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };

// ══ DOM ══════════════════════════════════════════════════════════════════════
function h(tag, attrs = {}, ...kids) {

}
const H = (s) => { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstElementChild; };
/** Shows an element at presence v: fades and un-blurs in, with an optional rise. */
function fx(el, v, o = {}) {

  el.style.visibility = v < 0.003 ? "hidden" : "visible";
  el.style.filter = v > 0.995 || blur === 0 ? "none" : `blur(${((1 - v) * blur).toFixed(2)}px)`;
  if (dy || sc || o.tx) el.style.transform = `translate(${o.tx || 0}px, ${((1 - v) * dy).toFixed(2)}px) scale(${(1 - (1 - v) * sc).toFixed(4)})`;
}

// ══ Data: the demo folder, as the app shows it (docs/motion/demo/facts.json, out/motion-demo/pages) ══════════

  ["Credit Card", range(1, 10)], ["Electricity", [1, 2, 3, 4, 5, 7, 8, 9, 10]], ["Groceries Market", range(3, 7)], ["Groceries Online", [3, 4, 9]],
  ["Gym", range(1, 5)], ["HOA Invoice", [1, 4, 7, 10]], ["HOA Payment", [1, 4, 7]], ["Home Meter", [7, 8, 9, 10], { 8: 2, 10: 2 }],
  ["Insurance Car", [1, 4, 7, 10]], ["Insurance Health", range(1, 10)], ["Insurance Life", [1, 7]], ["Internet Invoice", range(3, 10)],
  ["Internet Payment", range(3, 10)], ["Internet Receipt", range(3, 9)],
];

/** A rectangle that morphs (position, size, radius) with its content kept in world coordinates. */
function morph(cls = "", style = {}) {
  const outer = h("div", { class: "abs " + cls, style: { overflow: "hidden", ...style } });
  const inner = h("div", { class: "abs", style: { left: "0", top: "0", width: "1280px", height: "1040px" } });
  outer.append(inner);
  return {
    outer, inner,
    set(r) { // [x, y, w, h, radius]
      const [x, y, w, hh, rad] = r;
      outer.style.left = x + "px"; outer.style.top = y + "px";
      outer.style.width = Math.max(0, w) + "px"; outer.style.height = Math.max(0, hh) + "px";
      outer.style.borderRadius = rad + "px";
      inner.style.transform = `translate(${-x}px, ${-y}px)`;
    },
  };
}

  footer.querySelector(".spinner").style.transform = `rotate(${(t * 514) % 360}deg)`;
  // when each row's reading lands: rows 1–9 cascade before 9.2, Oct #1 on 9.2/9.3/9.4, the glare photo after
  const landAt = (i) => i < R_OCT ? bt(9, 1, 0.35) + i * 0.045 : i < R_GLARE ? bt(9, 2 + i - R_OCT) + 0.22 : bt(9, 4, 0.55);
  const fixed = vis(t, [[bt(10, 3, 0.75), T + bt(7, 3)]], SNAP), ignored = vis(t, [[bt(10, 4, 0.55), T + bt(7, 3)]], SNAP);
  const dated = vis(t, [[bt(11, 3), T + bt(7, 3)]], SP);
  rrows.forEach((r, i) => {
    const got = vis(t, [[landAt(i), T + bt(7, 3)]], FAST);
    if (r.taken.length === 2) { fx(r.taken[0], 1 - dated, { blur: 4 }); fx(r.taken[1], vis(t, [[bt(11, 3) + 0.06, T + bt(7, 3)]], SP), { blur: 4, dy: -6 }); }
    const ign = i === R_GLARE ? ignored : 0;
    fx(r.shows[0], 1 - got, { blur: 3 }); fx(r.shows[1], got - ign, { blur: 3 }); if (r.shows[2]) fx(r.shows[2], ign, { blur: 3 });
    const fx7 = i === R_SEP ? vis(t, [[bt(10, 2, 0.6), T + bt(7, 3)]], SNAP) : 0; // the field being edited
    fx(r.kwh[0], 1 - got, { blur: 3 }); fx(r.kwh[1], got - fx7 - ign, { blur: 3 });
    if (i === R_SEP) {
      fx(r.kwh[2], fx7, { blur: 0 });
      const n = KEYS.slice(8, 12).filter((k) => t >= k).length + (t >= bt(10, 3) - 0.01 ? 1 : 0);
      r.typed.textContent = t < bt(10, 2, 0.6) ? "" : t < bt(10, 3) - 0.01 ? "7864.00" : "78.64".slice(0, Math.min(5, n + (n >= 3 ? 1 : 0)));
      r.kwh[2].style.boxShadow = t > bt(10, 3, 0.75) ? "none" : "0 0 0 2px #e4e4e7";
      r.kwh[2].style.borderColor = t > bt(10, 3, 0.75) ? "var(--input)" : "var(--ring)";
      r.kwh[2].querySelector(".typed").style.background = t >= bt(10, 2, 0.6) && t < bt(10, 3) - 0.01 ? "#bfdbfe00" : "none";
    }
    if (i === R_GLARE) fx(r.kwh[2], ign, { blur: 3 });
    const isFix = i === R_SEP ? fixed : i === R_GLARE ? ignored : 0;
    fx(r.by[0], 1 - got, { blur: 3 });
    if (r.by.length === 3) { fx(r.by[1], got - isFix, { blur: 3 }); fx(r.by[2], isFix, { blur: 3 }); } else fx(r.by[1], got, { blur: 3 });
    fx(r.ai[0], 1 - got, { blur: 3 }); fx(r.ai[1], got, { blur: 3 });
    const [, , , , , tin, tout] = READINGS[i];
    const tick = clamp(S(t - landAt(i), SOFT));
    r.tok.textContent = got < 0.01 ? "" : `${fmtInt(tin * tick)} / ${Math.round(tout * tick)} / 0`;
    r.file.style.textDecoration = i === R_SEP && Math.abs(t - bt(10, 1)) < 0.25 ? "underline" : "none";
    r.tr.style.transform = "";
  });
  fx(readCard.querySelector("#ms0"), 1 - readDone, { blur: 3 });
  fx(readCard.querySelector("#ms1"), readDone - dated, { blur: 3 });
  fx(readCard.querySelector("#ms2"), dated, { blur: 3 });
  fx(readCard.querySelector("#dn0"), 1 - dated, { blur: 3 }); fx(readCard.querySelector("#dn1"), dated, { blur: 3 });
  fx(readCard.querySelector("#prob"), readDone - fixed, { blur: 3 });

  // Photo tiles (9.2–9.4)
  tiles.forEach((tl, i) => {
    const ta = bt(9, 2 + i);
    const v = vis(t, [[ta - 0.06, W.tiles[0][1]]], SP, FAST);
    tl.e.style.left = (170 + i * 320) + "px"; tl.e.style.top = "330px";
    fx(tl.e, v, { blur: 8, dy: 24, scale: 0.08 });
    if (v > 0.003) setLCD(tl.lcd, TILES[i][1], t, ta + 0.05);
  });
  // Photo viewer: grows out of the file name
  const pvv = vis(t, W.photo, SP, FAST);
  const fr = M.rr[R_SEP].file, pf = [90, 60, 1100, 920];
  photoM.set([mix(fr.x, pf[0], pvv), mix(fr.y, pf[1], pvv), mix(fr.w * 0.5, pf[2], pvv), mix(fr.h, pf[3], pvv), mix(6, 14, pvv)]);
  photoM.outer.style.visibility = pvv < 0.01 ? "hidden" : "visible";
  photoM.outer.style.opacity = clamp(pvv * 3).toFixed(3);
  photoDim.style.opacity = pvv.toFixed(3); photoDim.style.visibility = pvv < 0.01 ? "hidden" : "visible";
  fx(photoBody, clamp(pvv * 1.4 - 0.4), { blur: 6 });
  if (pvv > 0.01) setLCD(lcdBig, "078.64", t, -1);
  // Menus
  const menuAt = (m, anchor, sel, wins, path, chosen) => {
    const v = vis(t, wins, SNAP, FAST);
    m.e.style.left = (anchor.x + (anchor.w - m.e.offsetWidth) / 2) + "px";
    m.e.style.top = (anchor.cy - 4 - 13 - sel * 26) + "px";
    fx(m.e, v, { blur: 0, scale: 0.03 });
    m.e.style.transformOrigin = `50% ${4 + 13 + sel * 26}px`;
    if (v < 0.003) return;
    // highlight: two edges on two springs, the leading one faster
    const top = track(path.map(([tt, idx], j) => [tt, idx * 26, j && idx > path[j - 1][1] ? SP : FAST]))(t);
    const bot = track(path.map(([tt, idx], j) => [tt, idx * 26 + 26, j && idx > path[j - 1][1] ? FAST : SP]))(t);
    m.hl.style.top = 4 + top + "px"; m.hl.style.height = Math.max(0, bot - top) + "px";
    m.checks.forEach((c, j) => (c.textContent = j === (t >= chosen[0] ? chosen[1] : sel) ? "✓" : ""));
  };
  const sheetOff = { dy: -scroll };
  menuAt(mIns, M.insSel, 0, [[bt(4, 2), bt(4, 3) + 0.08]], [[0, 0], [bt(4, 2, 0.4), 1]], [bt(4, 3), 1]);
  const gymS = { ...M.gymSel };
  menuAt(mGym, gymS, 0, [[bt(5, 1), bt(5, 1, 0.55) + 0.06]], [[0, 0], [bt(5, 1, 0.22), 2]], [bt(5, 1, 0.55), 2]);
  menuAt(mEvery, M.gymEvery, 1, [[bt(5, 2), bt(5, 2, 0.55) + 0.06]], [[0, 1], [bt(5, 2, 0.22), 0]], [bt(5, 2, 0.55), 0]);
  menuAt(mUntil, M.gymUntil, 11, [[bt(5, 3), bt(5, 4) + 0.06]], [[0, 11], [bt(5, 3, 0.3), 4]], [bt(5, 4), 4]);
  menuAt(mReader, { ...M.readerSel, y: M.readerSel.y - scroll, cy: M.readerSel.cy - scroll }, 0, [[bt(8, 1), bt(8, 2) + 0.06]], [[0, 0], [bt(8, 1, 0.3), 1]], [bt(8, 2), 1]);
  menuAt(mShows, M.rr[R_GLARE].shows, 0, [[bt(10, 4), bt(10, 4, 0.55) + 0.06]], [[0, 0], [bt(10, 4, 0.25), 2]], [bt(10, 4, 0.55), 2]);
  // menus live in the window: the meters one moves with the sheet
  mReader.e.style.transform += ` translateX(${((1 - sv) * 470).toFixed(1)}px)`;

  // Payment screenshot and its date (bar 11)
  const pyv = vis(t, W.pay, SP, FAST);
  payShot.style.left = M.pay.x + "px"; payShot.style.top = M.pay.y + "px";
  fx(payShot, pyv, { blur: 8, dy: 30, scale: 0.05 });
  const lift = clamp(S(t - bt(11, 2), SP)), land = clamp(S(t - bt(11, 2, 0.5), SP));
  const fd = vis(t, [[bt(11, 2), bt(11, 3) + 0.05]], FAST, SNAP);
  const tx0 = M.payDate.x - 10, ty0 = M.payDate.y - 7, tr = M.rr[R_SEP].taken;
  flyDate.style.left = mix(tx0, tr.x - 6, land) + "px";
  flyDate.style.top = (mix(ty0 - 18 * lift, tr.y - 6, land)) + "px";
  fx(flyDate, fd, { blur: 0, scale: 0 });
  flyDate.style.transform = `scale(${1 + 0.08 * lift * (1 - land)})`;

  // ── Anatomy (bar 3) ──
  const sp = clamp(S(t - bt(3, 2), SP)), up = clamp(S(t - bt(3, 3), SP));
  const gaps = [0, 1, 1, 1, 0.35].map((g) => g * 28 * sp);
  const ch = 26.4; // mono 44px advance
  const widths = SEGS.map(([s]) => s.length * ch);
  const spaceW = ch;
  let total = widths.reduce((a, b) => a + b, 0) + spaceW * 3 + gaps.reduce((a, b) => a + b, 0);
  let x = 640 - total / 2;
  const y0 = mix(520, 432, up) - 22 - 18 * sp * (1 - up);
  segEls.forEach((s, i) => {
    if (i > 0) x += (i < 4 ? spaceW : 0) + gaps[i];
    s.e.style.left = x + "px"; s.e.style.top = y0 + "px";
    s.e.style.background = sp > 0.02 && i < 4 ? rgb(hex("#f4f4f5"), sp) : "transparent";
    s.e.style.borderRadius = "8px"; s.e.style.padding = "0";
    s.e.style.color = i === 4 ? "#a1a1aa" : "#09090b";
    s.l.style.left = x + widths[i] / 2 + "px"; s.l.style.top = (y0 + 60) + "px";
    fx(s.l, sp, { blur: 4, dy: -8 });
    x += widths[i];
  });
  fx(anatRows[0], vis(t, [[bt(3, 3) + 0.05, bt(4, 1)]]), { blur: 5, dy: 12 });
  fx(anatRows[1], vis(t, [[bt(3, 4) + 0.05, bt(4, 1)]]), { blur: 5, dy: 12 });
  anatRows[0].querySelector("#hl1").style.background = rgb(hex("#e4e4e7"), vis(t, [[bt(3, 3, 0.35), bt(4, 1)]]));
  anatRows[1].querySelectorAll(".hl2").forEach((e) => (e.style.background = rgb(hex("#e4e4e7"), vis(t, [[bt(3, 4, 0.35), bt(4, 1)]]))));

  // ── Page 1 (13.x, 16.1) ──
  const k1v = (i) => vis(t, [[bt(12, 4) + 0.05 + i * 0.07, T]]);
  [...page1.querySelectorAll(".p1kpi")].forEach((e, i) => fx(e, i < 1 ? vis(t, [[bt(12, 4), T]]) : k1v(i - 1), { blur: 5, dy: 10 }));
  page1.querySelector("#paidBar").style.width = 21.4 * clamp(S(t - bt(13, 1) - 0.1, SP)) + "%";
  page1.querySelector("#covBar").style.width = 97 * clamp(S(t - bt(13, 1) - 0.2, SP)) + "%";
  [...page1.querySelectorAll("#chartBars .bar")].forEach((e, i) => (e.style.transform = `scaleY(${clamp(S(t - bt(13, 2) - i * 0.035, SP), 0, 1.02)})`));
  [...page1.querySelectorAll("#chartBars .bv")].forEach((e, i) => fx(e, vis(t, [[bt(13, 3) + i * 0.03, T]]), { blur: 3, dy: 6 }));
  [...page1.querySelectorAll("#dueChips .chipy")].forEach((e, i) => fx(e, vis(t, [[bt(13, 4) - 0.1 + i * 0.03, T]]), { blur: 4, dy: 6 }));
  [...page1.querySelectorAll("#missList > div")].forEach((e, i) => fx(e, vis(t, [[bt(13, 4) + 0.15 + i * 0.05, T]]), { blur: 4, dy: 6 }));
  [...page1.querySelectorAll(".hkline")].forEach((e, i) => {
    const v = i === 2 ? vis(t, [[bt(16, 1) + 0.25, T]], SP) : 1;
    fx(e, v, { blur: 4, tx: (1 - v) * 40 });
    e.style.background = i === 2 ? rgb(hex("#fef3c7"), vis(t, [[bt(16, 1) + 0.35, T]]) * 0.9) : "transparent";
    e.style.borderRadius = "4px"; e.style.padding = "0 4px"; e.style.marginLeft = "-4px";
  });
  // ── Page 2: the matrix fills ──
  mxEls.forEach((c) => {
    const ta = c.kind === "check" ? bt(14, 2) - 0.25 + c.m * 0.04 + (c.y - 158) * 0.0006 : c.kind === "dot" ? bt(14, 1) + 0.1 : bt(14, 3) + (c.kind === "miss" ? 0.12 : 0) + (c.y - 158) * 0.0008;
    const v = vis(t, [[ta, T]], FAST);
    fx(c.el, v, { blur: 0, scale: 0.6 });
  });
  // ── Page 4 ──
  [...page4.querySelectorAll(".p4kpi")].forEach((e, i) => fx(e, vis(t, [[bt(15, 1) + 0.05 + i * 0.07, T]]), { blur: 5, dy: 10 }));
  [...page4.querySelectorAll(".cbar")].forEach((e, i) => (e.style.transform = `scaleX(${clamp(S(t - bt(15, 1) - 0.25 - i * 0.05, SP))})`, e.style.transformOrigin = "0 50%"));
  const rowHL = vis(t, [[bt(15, 2), T]]);
  const cyc4 = page4.querySelectorAll(".cyc")[3];
  cyc4.style.background = rgb(hex("#f4f4f5"), rowHL);
  fx(page4.querySelector("#formula"), vis(t, [[bt(15, 2) + 0.12, T]]), { blur: 6, dy: 14 });
  [...page4.querySelectorAll(".tdot")].forEach((e, i) => fx(e, vis(t, [[bt(15, 3) + i * 0.06, T]], FAST), { blur: 0, scale: 1 }));
  [...page4.querySelectorAll(".nt")].forEach((e, i) => fx(e, vis(t, [[bt(15, 2) + 0.3 + i * 0.05, T]]), { blur: 4, dy: 6 }));
  // ── Page 5 ──
  [...page5.querySelectorAll(".tur")].forEach((e, i) => (e.style.background = i === 2 ? rgb(mixc(hex("#ffffff"), hex("#fef3c7"), 0.55 * vis(t, [[bt(15, 4) + 0.2, T]]))) : ""));

  // ── Keycaps ──
  KEYCAPS.forEach(([tk, i]) => {
    const v = vis(t, [[tk - 0.18, tk + 0.42]], FAST, FAST);
    const g = keycaps[i];
    g.style.left = (720 - 80) + "px"; g.style.top = (1270 + (1 - v) * 30) + "px";
    fx(g, v, { blur: 0 });
    const p = press(t, tk);
    [...g.children].forEach((k) => { k.style.transform = `translateY(${p * 3}px)`; k.style.borderBottomWidth = (4 - p * 3) + "px"; });
  });

  // ── Cursor ──
  const [wx, wy] = cur(t);
  const [sx, sy] = toScreen(wx, wy);
  const pr = CLICKS.reduce((a, tc) => a + press(t, tc), 0) + press(t, bt(7, 2));
  cursor.style.transform = `translate(${(sx - 4).toFixed(2)}px, ${(sy - 3).toFixed(2)}px) scale(${(1 - 0.16 * clamp(pr)).toFixed(4)})`;
}

window.seek = seek;
window.T = T;
window.B = B;
window.ready = document.fonts.ready.then(() => { seek(0); return true; });
if (!/render/.test(location.search)) { // open the file in a browser to watch it
  const t0 = performance.now();
  const loop = () => { seek(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
