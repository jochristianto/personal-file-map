<!doctype html>

<title>Personal File Map · reel</title>
<!--
  A 15-second motion reel for Personal File Map, as one page seeked frame by frame (render.mjs calls window.seek(t)).
  Every style is a pure function of t: no CSS transitions, no timers, nothing kept between frames.
  Timing: 123.997 BPM (the song's measured tempo), 31 beats = 15.00 s. Beat n is at b(n).
  Labels, colors and numbers are the app's own (src/window.html, src/pdf.ts, docs/motion/demo/facts.json).
-->
<style>

  .abs { position: absolute; left: 0; top: 0; }
  .scene { position: absolute; inset: 0; overflow: hidden; display: none; }

  .page .sub { font-size: 12.5px; color: #71717a; }
  .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; height: 25px; padding: 0 10px; border-radius: 13px; background: #fffbeb; border: 1px solid #fde68a; color: #b45309; font-size: 12.5px; font-weight: 500; }

  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #16a34a; transform-origin: 0 0; }
</style>

<body>
<div id="frame"></div>
<script>
// ───────────────────────── time, easing, springs ─────────────────────────
const BPM = 123.997, B = 60 / BPM, T = 15.0, W = 1920, H = 1080;
const b = (n) => n * B;
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, x) => a + (c - a) * x;
const p = (t, a, d) => clamp((t - a) / d);
const E = {
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inExpo: (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10)),
  inOutExpo: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outQuart: (x) => 1 - Math.pow(1 - x, 4),
  inOutQuart: (x) => (x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2),
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
};
// Closed-form step response of a damped spring, s seconds after release (f: Hz, z: damping ratio)
function spring(s, f = 2.5, z = 0.6) {
  if (s <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z >= 1) return 1 - (1 + w * s) * Math.exp(-w * s);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + ((z * w) / wd) * Math.sin(wd * s));
}
// Decaying shake, for impacts
const shake = (t, t0, amp, freq = 31, decay = 9) => (t < t0 ? 0 : amp * Math.sin((t - t0) * freq * 2 * Math.PI) * Math.exp(-(t - t0) * decay));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const RGB = {};
const rgbOf = (h) => RGB[h] || (RGB[h] = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)));
const hex2 = (v) => Math.round(v).toString(16).padStart(2, "0");
const mixc = (a, c, k) => { const A = rgbOf(a), C = rgbOf(c); k = clamp(k); return "#" + [0, 1, 2].map((i) => hex2(A[i] + (C[i] - A[i]) * k)).join(""); };

// ───────────────────────── DOM helpers ─────────────────────────
const frame = document.getElementById("frame");
function h(tag, props = {}, parent) {
  const e = tag.startsWith("svg:") ? document.createElementNS("http://www.w3.org/2000/svg", tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "cls") e.setAttribute("class", v);
    else if (k === "style") typeof v === "string" ? e.setAttribute("style", v) : Object.assign(e.style, v);
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;

  }

  return e;
}
// Style setter that only touches the DOM when a value changes
function st(e, o) { const c = e.__s || (e.__s = {}); for (const k in o) { const v = o[k]; if (c[k] !== v) { c[k] = v; e.style[k] = v; } } }
function at(e, o) { const c = e.__a || (e.__a = {}); for (const k in o) { const v = o[k]; if (c[k] !== v) { c[k] = v; e.setAttribute(k, v); } } }
const vis = (e, on) => st(e, { display: on ? "block" : "none" });
const px = (v) => `${v.toFixed(2)}px`;

// ───────────────────────── the app's palette ─────────────────────────
const C = {
  ink: "#09090b", card: "#121214", fg: "#fafafa", fg2: "#e4e4e7", muted: "#a1a1aa", faint: "#71717a", dim: "#52525b", line: "#27272a",
  lbg: "#fafafa", lfg: "#09090b", lmuted: "#71717a", lborder: "#e4e4e7", lline: "#f4f4f5",
  green: "#16a34a", greenD: "#4ade80", greenText: "#15803d", greenBg: "#dcfce7",
  amber: "#d97706", amberText: "#b45309", amberBg: "#fef3c7", amberBorder: "#fde68a",
  rose: "#e11d48", roseText: "#be123c", roseBg: "#ffe4e6",
  blue: "#2563eb", blueBg: "#eff6ff", violet: "#7c3aed", violetD: "#a78bfa", violetT: "#c4b5fd",
};
const ICON = {
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>',

  sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0L14.06 8.5A2 2 0 0 0 15.5 9.94l6.14 1.58a.5.5 0 0 1 0 .96L15.5 14.06a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
};
const CHECK = (s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#16a34a"/><path d="M4.6 8.3l2.2 2.2 4.6-4.8" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const DUE = (s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2 1.6"/><path class="hand" d="M8 5v3.2l2 1.2" fill="none" stroke="#b45309" stroke-width="1.3" stroke-linecap="round" style="transform-origin:8px 8px"/></svg>`;
const MISS = (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#ffe4e6"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="#be123c" stroke-width="1.8" stroke-linecap="round"/></svg>`;

// ───────────────────────── layers ─────────────────────────
const S1 = h("div", { cls: "scene", style: { perspective: "1100px", perspectiveOrigin: "960px 540px" } }, frame);
const S2 = h("div", { cls: "scene" }, frame);
const S3 = h("div", { cls: "scene", style: { background: C.lbg } }, frame);
const S5 = h("div", { cls: "scene", style: { background: "radial-gradient(1200px 800px at 50% 45%, #1c1c20 0%, #09090b 70%)" } }, frame);
const S4 = h("div", { cls: "scene" }, frame);
const S6 = h("div", { cls: "scene", style: { background: "radial-gradient(1100px 760px at 30% 45%, #18181c 0%, #09090b 70%)" } }, frame);
const S7 = h("div", { cls: "scene" }, frame);
const RING = h("div", { cls: "abs", style: { borderRadius: "50%", border: "3px solid #2563eb", boxShadow: "0 0 40px rgba(37,99,235,.6), inset 0 0 40px rgba(37,99,235,.35)", display: "none", pointerEvents: "none" } }, frame);
const FLASH = h("div", { cls: "abs", style: { width: "1920px", height: "1080px", background: "#fff", opacity: 0, pointerEvents: "none" } }, frame);
const VIGN = h("div", { cls: "abs", style: { width: "1920px", height: "1080px", background: "radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%)", pointerEvents: "none" } }, frame);
const GRAIN = h("div", { cls: "abs", style: { width: "1920px", height: "1080px", mixBlendMode: "overlay", opacity: 0.07, pointerEvents: "none" } }, frame);
const HUD = h("div", { cls: "abs", style: { width: "1920px", height: "1080px", pointerEvents: "none" } }, frame);
// ?gif: no grain or vignette, which GIF can only band or dither (render.mjs --gif)
if (location.search.includes("gif")) { GRAIN.remove(); VIGN.remove(); }

// ═════════════════════════ S1 · SORT (b0–b4): a folder dump becomes a sorted list ═════════════════════════
const PICK = ["202601 Credit Card.pdf", "202601 Gym.jpg", "202601 HOA Payment.jpg", "202601 Insurance Health.pdf", "202601 Phone.pdf", "202601 Property Tax 2 Payment.pdf", "202601 Salary.png", "202601 Water.pdf", "202602 Credit Card.pdf", "202602 Gym.jpg", "202602 Phone.pdf", "202602 Rent.pdf", "202602 Streaming.png", "202603 Car Loan.jpg", "202603 Electricity.pdf", "202603 Groceries Online.jpg", "202603 Insurance Health.pdf", "202603 Internet Payment.jpg", "202603 Mortgage Received.png", "202603 Phone.pdf", "202603 Salary.png", "202603 Water.pdf", "202604 Credit Card.pdf", "202604 Groceries Market.jpg", "202604 Gym.jpg", "202604 HOA Payment.jpg", "202604 Insurance Health.pdf", "202604 Internet Payment.jpg", "202604 Mortgage Received.png", "202604 Phone.pdf", "202604 Salary.png", "202604 Water.pdf", "202605 Charity.png", "202605 Electricity.pdf", "202605 Gym.jpg", "202605 Internet Invoice.pdf", "202605 Internet Receipt.pdf", "202605 Mortgage Sent.jpg", "202605 Rent.pdf", "202605 Streaming.png", "202606 Car Loan.jpg", "202606 Groceries Market.jpg", "202606 Internet Invoice.pdf", "202606 Internet Receipt.pdf", "202606 Mortgage Sent.jpg", "202606 Rent.pdf", "202606 Streaming.png", "202607 Car Loan.jpg", "202607 Electricity.pdf", "202607 HOA Invoice.pdf", "202607 Home Meter #1 After.jpg", "202607 Home Meter #1 Input.jpg", "202607 Insurance Car.pdf", "202607 Insurance Life.pdf", "202607 Internet Payment.jpg", "202607 Mortgage Received.png", "202607 Phone.pdf", "202607 Salary.png", "202607 Water.pdf", "202608 Credit Card.pdf", "202608 Home Meter #1 After.jpg", "202608 Home Meter #2 Payment Receipt.jpg", "202608 Insurance Health.pdf", "202608 Mortgage Received.png", "202609 Home Meter #1 Before.jpg", "202609 Rent.pdf",
  "202610 Car Loan.jpg", "202610 Home Meter #1 Before.jpg", "202610 Salary.png", "202611 Mortgage Sent.jpg", "202611 Rent.pdf", "202611 Salary.png"].sort();
const TARGET = "202610 Home Meter #1 Before.jpg";
const S1FS = 16, S2FS = 64, ROWS = 18, COLW = 432;
const s1big = h("div", { cls: "abs nw", style: { left: "960px", top: "540px", font: "800 400px/1 Inter", letterSpacing: "-0.055em", color: "transparent", webkitTextStroke: "2px #2a2a30", fontVariantNumeric: "tabular-nums" } }, S1);
const s1bigLbl = h("div", { cls: "abs mono nw", style: { left: "960px", top: "760px", fontSize: "18px", letterSpacing: ".22em", color: C.dim, textTransform: "uppercase" }, text: "bills · receipts · screenshots · one folder" }, S1);
const s1world = h("div", { cls: "abs", style: { left: "960px", top: "540px", transformStyle: "preserve-3d" } }, S1);
const s1sweep = h("div", { cls: "abs", style: { width: "2px", height: "600px", top: "-300px", background: "linear-gradient(transparent, #4ade80, transparent)", boxShadow: "0 0 18px #4ade80", opacity: 0 } }, s1world);
const r1 = rng(11);
const names = PICK.map((name, i) => {
  const e = h("div", { cls: "abs mono nw", style: { fontSize: S1FS + "px", lineHeight: "1", willChange: "transform" } }, s1world);
  const pre = h("span", { text: name.slice(0, 6) }, e);
  const rest = h("span", { text: name.slice(6) }, e);
  const col = Math.floor(i / ROWS), row = i % ROWS;
  return {
    e, pre, rest, name, i, target: name === TARGET,
    gx: -COLW * 2 + col * COLW + 6, gy: -ROWS * 15 + row * 30 + 15,
    cx: (r1() * 2 - 1) * 1100, cy: (r1() * 2 - 1) * 600, cz: -1700 + r1() * 1850,
    vx: (r1() * 2 - 1) * 40, vy: (r1() * 2 - 1) * 30, ry: (r1() * 2 - 1) * 55, rz: (r1() * 2 - 1) * 22,
    d0: r1() * 0.16, d1: r1() * 0.05, w: 0,

});
const tgt = names.find((n) => n.target);

function s1(t) {
  // giant outlined counter behind the dump
  const kc = E.outExpo(p(t, 0, b(1.8)));
  const out = E.inExpo(p(t, b(1.8), b(0.6)));
  s1big.textContent = String(Math.round(178 * kc));
  st(s1big, { transform: `translate(-50%,-50%) scale(${(0.8 + 0.25 * kc + 0.6 * out).toFixed(4)})`, opacity: ((1 - out) * clamp(t * 6)).toFixed(3) });
  st(s1bigLbl, { transform: `translate(-50%,0) translateY(${px(16 * (1 - E.outExpo(p(t, b(0.6), 0.5))))})`, opacity: (E.outExpo(p(t, b(0.6), 0.4)) * (1 - p(t, b(1.9), 0.25))).toFixed(3) });

  st(s1world, { transform: `translate3d(${px(ox)},${px(oy)},0) scale(${s.toFixed(5)})` });

  const sw = E.inOutCubic(p(t, b(3) - 0.04, 0.42));
  const sx = lerp(-COLW * 2 - 60, COLW * 2 + 60, sw);

  const fadeOthers = 1 - E.outCubic(p(t, b(3.4), 0.3));
  for (const n of names) {
    const kb = E.outExpo(p(t, n.d0, 0.75));
    // chaos: burst from a point far away, then drift toward the camera
    const ccx = n.cx + n.vx * t, ccy = n.cy + n.vy * t, ccz = n.cz + 320 * t;
    let x = lerp(0, ccx, kb), y = lerp(0, ccy, kb), z = lerp(-3200, ccz, kb);
    let ry = n.ry * (1 - 0.3 * kb), rz = n.rz;

    if (!n.target) op *= fadeOthers;
    const lit = clamp((sx - n.gx) / 90) * ks;
    const preC = mixc(mixc("#b4b4bc", "#a1a1aa", ks), "#fafafa", lit);
    const restBase = n.target ? mixc("#52525b", "#fafafa", zk) : "#52525b";
    st(n.pre, { color: preC });
    st(n.rest, { color: lit > 0 ? (n.target && zk > 0 ? restBase : mixc("#a1a1aa", "#52525b", lit)) : mixc("#b4b4bc", "#a1a1aa", ks) });
    st(n.e, { transform: `translate3d(${px(x - n.w / 2)},${px(y - S1FS / 2)},${px(z)}) rotateY(${ry.toFixed(2)}deg) rotateZ(${rz.toFixed(2)}deg)`, opacity: op.toFixed(3) });
  }
}

// ═════════════════════════ S2 · PARSE (b4–b8): the name explains itself ═════════════════════════
const TOK = [
  { s: "2026", at: 0, label: "Year", c: "#a1a1aa", acc: "#71717a" },
  { s: "10", at: 4, label: "Month", c: "#fafafa", acc: C.blue },

  { s: ".jpg", at: 27, label: "Type", c: "#71717a", acc: "#52525b" },
];
const s2eyebrow = h("div", { cls: "abs mono nw", style: { left: "960px", top: "250px", fontSize: "22px", letterSpacing: ".06em", color: "#71717a" } }, S2);
const s2head = h("div", { cls: "abs nw", style: { left: "960px", top: "296px", font: "800 112px/1.1 Inter", letterSpacing: "-0.045em", color: "#fafafa", transform: "translateX(-50%)" } }, S2);
const HEAD_WORDS = ["Just", "name", "your", "files."];
const s2words = HEAD_WORDS.map((w, i) => {

const toks = TOK.map((k) => {
  const box = h("div", { cls: "abs", style: { borderRadius: "16px", border: `2px solid ${k.acc}`, background: k.acc + "1f" } }, S2);
